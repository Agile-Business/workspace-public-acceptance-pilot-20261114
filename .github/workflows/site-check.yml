name: Public acceptance checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  site-check:
    name: site-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
